[project]
name = "soundcloud-pull"
version = "1.1.1"
description = "Download your own tracks from a music streaming link and recover instrumentals with Demucs."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "yt-dlp>=2025.1.15",
]

[project.optional-dependencies]
instrumental = [
    "demucs>=4.0.0",
    "numpy>=1.26",
]

[project.scripts]
soundcloud-pull = "soundcloud_pull:main"
make-instrumental = "make_instrumental:main"
cloud-chaser = "cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["soundcloud_pull", "make_instrumental", "cli", "server"]
