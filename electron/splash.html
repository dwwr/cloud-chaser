<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Cloud Chaser</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0080ff;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #stack {
        display: flex;
        flex-direction: column;
        align-items: center;
        box-sizing: border-box;
        padding: 0.75rem 0.75rem 1.15rem;
      }
      img {
        display: block;
        width: 526.5px;
        height: 361px;
      }
      .caption {
        margin-top: 1.35rem;
        padding-right: 0.12em;
        color: #ff0080;
        font:
          italic 3.54375rem/1.35 "Avenir Next",
          "Segoe UI",
          sans-serif;
        text-align: center;
        text-shadow:
          0.06em 0 0 color-mix(in srgb, #ff0080 62%, transparent),
          0.12em 0 0 color-mix(in srgb, #ff0080 34%, transparent),
          0 2px 16px #8000ff;
        opacity: 0;
        animation: fade-in 3s ease forwards;
      }
      .caption p {
        margin: 0;
      }
      @keyframes fade-in {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
    </style>
  </head>
  <body>
    <div id="stack">
      <img src="houseplants.png" alt="Houseplants" />
      <div class="caption">
        <p>No one is illegal.</p>
      </div>
    </div>
  </body>
</html>
